name: Deploy zu netcup

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Zugangsdaten prüfen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Bitte FTP_SERVER, FTP_USERNAME und FTP_PASSWORD unter Settings → Secrets and variables → Actions eintragen."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Hochladen per FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_SERVER_DIR || '/httpdocs/' }}
          # Nur Website-Dateien hochladen. api/config.php mit dem Brevo-Schlüssel
          # liegt nur auf dem Server und wird nie überschrieben oder gelöscht.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            DESIGN.md
            api/config.php
            api/config.example.php
            .env
